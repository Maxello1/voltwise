name: Publish optional synchronized edition
on:
  workflow_dispatch:
    inputs:
      deploy:
        description: Deploy the reviewed code and apply additive D1 migrations
        required: true
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: cloudflare-production
  cancel-in-progress: false
jobs:
  checks:
    if: inputs.deploy
    uses: ./.github/workflows/ci.yml
  deploy:
    needs: checks
    runs-on: ubuntu-latest
    environment: cloudflare-production
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '24'
      - uses: pnpm/action-setup@f520eceda224fe1a4aed5a2a27a194379a409996 # v6
        with:
          version: 11.25.0
      - run: pnpm install --frozen-lockfile
      - run: pnpm build:cloud
      - run: node scripts/production-config.mjs
        env:
          CLOUDFLARE_DATABASE_ID: ${{ vars.CLOUDFLARE_DATABASE_ID }}
          APP_ORIGIN: ${{ vars.APP_ORIGIN }}
          OWNER_GITHUB_ID: ${{ vars.OWNER_GITHUB_ID }}
          GITHUB_CLIENT_ID: ${{ vars.GITHUB_CLIENT_ID }}
      - name: Apply migrations and publish
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          pnpm exec wrangler d1 migrations apply voltwise --remote --config wrangler.production.jsonc
          pnpm exec wrangler deploy --config wrangler.production.jsonc
